    <script>
      try {
        const preference = localStorage.getItem('caf_theme');
        document.documentElement.classList.toggle('dark',
          preference === 'light' ? false : preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches : true);
      } catch { /* Dark remains usable without storage. */ }
