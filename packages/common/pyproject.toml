[project]
name = "caf-common"
version = "0.1.0"
description = "Common utilities, settings, logging, run context, and blob store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "caf-contracts",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "rich>=13.7",
    "google-genai>=0.1",
    "httpx>=0.27",
]

[tool.uv.sources]
caf-contracts = { workspace = true }
