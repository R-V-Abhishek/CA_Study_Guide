id: s2023.ibs_case_study.v1
applies_to:
  scheme: s2023
  doc_type: ibs_case_study
paper_max: null
patterns:
  question_start: &id001
  - re: ^\s*(?P<n>\d{1,2})\.\s*$
    max_x: 125
  part_start:
  - re: ^\s*\((?P<p>[a-hA-H])\)\s*
  subpart_start:
  - re: ^\s*\((?P<s>i{1,3}|iv|v|vi{0,3}|ix|x)\)\s*
  marks:
  - re: \((?P<m>\d{1,2})\s*Marks?\)
  - re: (?P<m>\d{1,2})\s*Marks?\s*$
  answer_start:
  - re: ^\s*ANSWERS\s+TO\s+THE\s+CASE\s+STUDY
  or_separator:
  - re: ^\s*OR\s*$
    require_bold: false
  case_scenario_start: &id002
  - re: ^\s*CASE\s+STUDY\s+(?P<n>\d+)\s*$
  mcq_start: *id001
  mcq_option:
  - re: ^\s*\((?P<o>[a-dA-D])\)(?:\s+|$)
  mcq_key_table_title: []
  mcq_key_row:
  - re: ^\s*(?P<n>\d{1,2})\s*[.)]?\s*\(?(?P<o>[A-Da-d])\)?\s*$
  paper_start:
  - re: ^\s*PAPER\s*[-:]?\s*(?P<n>\d+)\s*[:\-]
  section_start:
  - re: ^\s*SECTION\s*[-:]?\s*(?P<n>[A-Z]|\d+)\s*$
  content_start: *id002
  answer_question_start: *id001
  descriptive_start:
  - re: ^\s*(?:Answers to the )?Descriptive Questions\s*$
  mcq_section_start:
  - re: ^\s*(?:Answers to the )?Multiple Choice Questions\s*$
choice_rules:
- re: (?i)question\s+no\.?\s*1\s+is\s+compulsory
  compulsory:
  - Q1
- re: (?i)(?:attempt|answer)\s+any\s+(?P<k>two|three|four|five|\d)\s+(?:questions\s+)?(?:from|(?:out\s+)?of)\s+(?:the\s+)?remaining\s+(?P<n>two|three|four|five|six|\d)
  optional_pick: '{k}'
defaults:
  mcq_marks: 2
  min_unit_chars: 15
  max_unit_chars: 25000
mode: sectioned
document_role: mixed
expects_answers: true
marks_required: false
numbering_scopes:
- paper
- section
- case
- alternative
answers_preserve_case: true
source_page_start: 8
numbering_contiguous: false
