id: s2023.model_collection.P1.v1
applies_to:
  scheme: s2023
  doc_type: model_question
paper_max: null
patterns:
  question_start:
  - re: ^\s*(?P<n>\d{1,2})\.(?:\s+|$)
    max_x: 125
  part_start:
  - re: ^\s*\((?P<p>[a-hA-H])\)\s*
  subpart_start:
  - re: ^\s*\((?P<s>i{1,3}|iv|v|vi{0,3}|ix|x)\)\s*
  marks:
  - re: \((?P<m>\d{1,2})\s*Marks?\)
  - re: (?P<m>\d{1,2})\s*Marks?\s*$
  answer_start: []
  or_separator:
  - re: ^\s*OR\s*$
    require_bold: false
  case_scenario_start:
  - re: ^\s*CASE\s+SCENARIO\s*[-–]?\s*(?P<n>[IVX]+|\d+)
    require_bold: false
  mcq_start:
  - re: ^\s*(?P<n>\d{1,2})\.(?:\s+|$)
    max_x: 125
  mcq_option:
  - re: ^\s*\((?P<o>[A-Da-d])\)(?:\s+|$)
  mcq_key_table_title:
  - re: ^\s*PART\s*[-–—]?\s*I\s+CASE\s+SCENARIO\s+BASED\s+MCQS\s*$
  mcq_key_row:
  - re: ^\s*(?P<n>\d{1,2})\s*[.)]?\s*\(?(?P<o>[A-Da-d])\)?\s*$
  paper_start:
  - re: '^\s*PAPER\s*[-–—]?\s*(?P<n>\d+)\s*:'
  section_start:
  - re: ^\s*SECTION\s*[-:]?\s*(?P<n>[A-Z]|\d+)\s*$
  content_start:
  - re: ^\s*(?:ANSWERS\s+OF\s+)?MODEL\s+TEST\s+PAPER\s*(?P<n>\d+)\s*$
  collection_start:
  - re: ^\s*MODEL\s+TEST\s+PAPER\s*(?P<n>\d+)\s*$
  collection_answer_start:
  - re: ^\s*ANSWERS\s+OF\s+MODEL\s+TEST\s+PAPER\s*(?P<n>\d+)\s*$
  answer_question_start:
  - re: ^\s*(?P<n>\d{1,2})\.(?:\s+|$)
    max_x: 125
    require_bold: true
  mcq_section_start:
  - re: appropriate\s+option\s+in\s+the\s+below\s+questions
    require_bold: true
  descriptive_start: &id001
  - re: ^\s*PART\s*[-–—]?\s*II\s+DESCRIPTIVE\s+QUESTIONS\s*$
  case_end: *id001
  mcq_key_number:
  - re: ^\s*(?P<n>\d{1,2})\.\s*$
  mcq_key_option:
  - re: '^\s*Option\s*\((?P<o>[A-Da-d])\)\s*:'
choice_rules:
- re: (?i)question\s+no\.?\s*1\s+is\s+compulsory
  compulsory:
  - Q1
- re: (?i)(?:attempt|answer)\s+any\s+(?P<k>two|three|four|five|\d)\s+(?:questions\s+)?(?:from|(?:out\s+)?of)\s+(?:the\s+)?remaining\s+(?P<n>two|three|four|five|six|\d)
  optional_pick: '{k}'
defaults:
  mcq_marks: 2
  min_unit_chars: 15
  max_unit_chars: 25000
mode: sectioned
document_role: mixed
expects_answers: true
marks_required: false
numbering_scopes:
- paper
- section
- case
- alternative
numbering_contiguous: false
questions_require_section: true
key_table_ends_at_section: true
answer_new_parts_are_text: true
instructions_any_page: true
mcqs_compulsory: true
