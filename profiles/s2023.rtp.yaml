id: s2023.rtp.v1
applies_to:
  scheme: s2023
  doc_type: rtp
paper_max: 100
patterns:
  question_start:
    - re: '^\s*(?:QUESTION|Question)\s*(?:NO\.?|No\.?)?\s*(?P<n>\d{1,2})\b'
      require_bold: false
    - re: '^\s*(?P<n>\d{1,2})\.(?:\s+|$)'
      require_bold: false
  part_start:
    - re: '^\s*\((?P<p>[a-hA-H])\)\s*'
  subpart_start:
    - re: '^\s*\((?P<s>i{1,3}|iv|v|vi{0,3}|ix|x)\)\s*'
  marks:
    - re: '\((?P<m>\d{1,2})\s*Marks?\)'
    - re: '(?P<m>\d{1,2})\s*Marks?\s*$'
  answer_start:
    - re: '^\s*(?:SUGGESTED\s+ANSWERS?|ANSWERS?|Answer\s+to\s+Question\s+No\.?)\b'
      require_bold: false
  or_separator:
    - re: '^\s*OR\s*$'
      require_bold: false
  case_scenario_start:
    - re: '^\s*CASE\s+SCENARIO\s*[-–]?\s*(?P<n>[IVX]+|\d+)'
      require_bold: false
  mcq_start:
    - re: '^\s*(?P<n>\d{1,2})\.(?:\s+|$)'
  mcq_option:
    - re: '^\s*\((?P<o>[A-Da-d])\)\s+'
  mcq_key_table_title:
    - re: '(?i)answers?\s+to\s+(?:the\s+)?(?:MCQ|multiple\s+choice)'
  mcq_key_row:
    - re: '^\s*(?P<n>\d{1,2})\s*[.)]?\s*\(?(?P<o>[A-Da-d])\)?\s*$'
choice_rules: []
defaults:
  mcq_marks: 2
  min_unit_chars: 15
  max_unit_chars: 25000
mode: interleaved
