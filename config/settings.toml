# config/settings.toml
[app]
env = "development"
target_attempt_id = "2027-05"

[storage]
data_dir = "./data"
blob_dir = "./data/blobs"
inbox_dir = "./data/inbox"
debug_dir = "./data/debug"
log_dir = "./data/logs"
backup_dir = "./data/backups"

[database]
host = "127.0.0.1"
port = 5432
database = "caf"
user = "postgres"
password = "postgres_dev_password"

[curate]
auto_accept_bucket_a = false

[l0]
heading_size_threshold = 14.0

[l1]
min_delay_s = 5
max_delay_s = 10
max_downloads_per_session = 200

[baseline_notice]
# Shown on baseline-adopted questions and textbook sources whose applicability is still pending.
attempt_label = "May 2027"

[baseline_notice.paper_notes]
"s2023.P5" = "P5 includes older-edition material; check the prescribed syllabus before relying on it for the exam."
