[models]
primary = "gemini-3.6-flash"
fallbacks = ["gemini-3.8-flash", "gemini-3.5-flash"]

[pricing]  # USD per 1M tokens, standard paid tier, text input
# Source: https://ai.google.dev/gemini-api/docs/pricing and the model release notes, checked 2026-11-02.
# Budget caps use the standard rate. Gemini 3.6 and 3.8 Flash are half price until 2026-12-31
# (0.75 in / 3.75 out); caps are deliberately conservative until then.
# gemini-3.5-flash: the release notes give 9.00 output and "input remains 1.50" for 3.6; the 3.5 input
# price is not stated directly.
# gemini-3.7-flash is not on any published page, so it is not configured. Add it only with a source.
"gemini-3.5-flash"      = { input = 1.50, output = 9.00 }
"gemini-3.6-flash"      = { input = 1.50, output = 7.50 }
"gemini-3.8-flash"      = { input = 1.50, output = 7.50 }
"gemini-2.5-flash"      = { input = 0.30, output = 2.50 }
"gemini-2.0-flash"      = { input = 0.10, output = 0.40 }
"gemini-1.5-flash"      = { input = 0.075, output = 0.30 }
"gemini-2.5-flash-lite" = { input = 0.10, output = 0.40 }

