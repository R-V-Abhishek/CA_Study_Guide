[project]
name = "ca-final"
version = "0.2.1"
description = "CA Final Study Companion — One Place for CA Final Prep"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "caf-contracts",
    "caf-common",
    "caf-db",
    "caf-l0",
    "caf-l1",
    "caf-l2",
    "caf-l3",
    "caf-l4",
    "caf-l5",
    "caf-api",
    "caf-cli",
]

[project.scripts]
caf = "caf_cli.main:app"
caf-host = "caf_cli.host:app"

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
caf-contracts = { workspace = true }
caf-common = { workspace = true }
caf-db = { workspace = true }
caf-l0 = { workspace = true }
caf-l1 = { workspace = true }
caf-l2 = { workspace = true }
caf-l3 = { workspace = true }
caf-l4 = { workspace = true }
caf-l5 = { workspace = true }
caf-api = { workspace = true }
caf-cli = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packages/*/*.egg-info", "web", "artifacts", "output"]

[tool.ruff.lint]
# Bug-class baseline that passes today (syntax errors, undefined names, invalid
# comparisons). Style rules (E70x, F401, F811, import order) are deliberately
# deferred to the formatting step so this gate adds no code churn.
select = ["E9", "F63", "F7", "F82", "F402", "F601", "F632"]

[tool.mypy]
# CI checks only packages/api and packages/db (see .github/workflows/checks.yml).
# Not strict yet: the modules listed below carry known errors (Optional access on
# session.get results, untyped locals) and are excluded until they are fixed.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "caf_api.auth",
    "caf_api.curate",
    "caf_api.extraction",
    "caf_api.health",
    "caf_api.questions",
    "caf_api.routes",
    "caf_api.security_logging",
    "caf_api.taxonomy",
    "caf_db.alembic.versions.0003_identity",
]
ignore_errors = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
