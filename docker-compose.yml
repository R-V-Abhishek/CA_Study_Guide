services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${PG_DATABASE:-caf}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-postgres} -d ${PG_DATABASE:-caf}"]
      interval: 3s
      timeout: 5s
      retries: 15

