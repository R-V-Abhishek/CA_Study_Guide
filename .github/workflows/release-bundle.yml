name: Publish verified release bundle
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing accepted version tag (for example v0.2.0)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-bundle-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an accepted version on main
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q tests deploy/tests
      - run: uv run --no-sync scripts/verify_production_compose.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile && pnpm type-check && pnpm test:ui
        working-directory: web
      - name: Install age for the encrypted-backup drill
        run: sudo apt-get install -y --no-install-recommends age
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Fetch the PostgreSQL image the installed hosts run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("deploy/compatibility.toml", "rb"))["postgres_release"])')
          mkdir postgres-source
          gh release download "$tag" --pattern "caf-$tag-linux-amd64.tar.gz*" --dir postgres-source
          (cd postgres-source && sha256sum -c "caf-$tag-linux-amd64.tar.gz.sha256")
          echo "POSTGRES_BUNDLE=$PWD/postgres-source/caf-$tag-linux-amd64.tar.gz" >> "$GITHUB_ENV"
      - run: uv run --no-sync scripts/release_bundle.py build --platform linux/amd64 --postgres-from "$POSTGRES_BUNDLE"
      - name: Upload bundle then publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json; then
            jq -e '.isDraft == true' /tmp/release-state.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          # Only a draft reaches this line, so replacing a partial upload from an earlier attempt is safe.
          gh release upload "$RELEASE_TAG" release-output/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
