name: Application checks
on:
  push:
    branches: [main, feat/phase8-central-deployment, 'codex/**']
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q tests deploy/tests
      - run: uv run --no-sync scripts/verify_production_compose.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.6.0
      - name: Verify release version and lock update
        run: |
          npm install --prefix "$RUNNER_TEMP/release-check" --no-audit --no-fund --ignore-scripts release-please@17.3.0
          NODE_PATH="$RUNNER_TEMP/release-check/node_modules" node deploy/tests/release-version.cjs
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm type-check && pnpm test:ui && pnpm build
        working-directory: web
  bundle-candidate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: uv run --no-sync scripts/release_bundle.py build --candidate --platform linux/amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-linux-amd64
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
