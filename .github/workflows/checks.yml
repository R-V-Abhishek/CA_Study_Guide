name: Application checks
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Format
        run: uv run --no-sync ruff format --check packages tests deploy scripts *.py
      - name: Lint (bug-class rules)
        run: uv run --no-sync ruff check packages tests deploy scripts *.py
      - name: Type-check API and database packages
        run: uv run --no-sync mypy packages/api/caf_api packages/db/caf_db
      - run: uv run --no-sync pytest -q tests deploy/tests
      - run: uv run --no-sync scripts/verify_production_compose.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.6.0
      - name: Verify release version and lock update
        run: |
          npm install --prefix "$RUNNER_TEMP/release-check" --no-audit --no-fund --ignore-scripts release-please@17.3.0
          NODE_PATH="$RUNNER_TEMP/release-check/node_modules" node deploy/tests/release-version.cjs
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: API contract matches checked-in OpenAPI document and generated client
        run: |
          uv run --no-sync scripts/export_openapi.py
          pnpm --dir web --filter @caf/api-client generate
          git diff --exit-code openapi.json web/packages/api-client/src/generated.ts
      - name: Tracked frontend build output matches sources
        run: pnpm check:dist
        working-directory: web
      - run: pnpm format:check
        working-directory: web
      - run: pnpm type-check && pnpm test:ui && pnpm build
        working-directory: web
  browser:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      # The harness builds the SPAs and starts its own PostgreSQL container with synthetic data.
      - run: pnpm exec playwright test --project=chromium
        working-directory: web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
  bundle-candidate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Install age for the encrypted-backup drill
        run: sudo apt-get install -y --no-install-recommends age
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: uv run --no-sync scripts/release_bundle.py build --candidate --platform linux/amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-linux-amd64
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
