version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 3.x pulls in httpx2, which breaks the API test client (PR #39, 2026-11-09).
      - dependency-name: google-genai
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 7.x breaks openapi-typescript client generation (PR #34, 2026-11-09).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # 8.x needs @vitejs/plugin-react 6 with new peers (PR #36, 2026-11-10); migrate both together.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
